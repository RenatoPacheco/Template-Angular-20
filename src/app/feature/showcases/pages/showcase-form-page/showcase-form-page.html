<div class="container">
    <h1>Showcase Form Page</h1>    
    <form [formGroup]="form">
        <legend>Outro form</legend>
        <div class="form-grid">
            <app-form-text
                transform="cpf"                
                formControlName="cpf"
                label="Input CPF"
                placeholder="xxx.xxx.xxx-xx">
            </app-form-text>
            
            <app-form-text
                transform="cnpj"                
                formControlName="cnpj"
                label="Input CNPJ"
                placeholder="xx.xxx.xxx/xxxx-xx">
            </app-form-text>
            
            <app-form-text
                transform="date"                
                formControlName="data"
                label="Input Date"
                placeholder="dd/mm/yyyy">
            </app-form-text>
            
            <app-form-datepicker
                formControlName="dataPicker"
                label="Datepicker"
                placeholder="dd/mm/yyyy">
            </app-form-datepicker>

            <app-form-datepicker
                formControlName="periodo"
                mode="range"
                label="Período">
            </app-form-datepicker>
            
            <app-form-text
                transform="timeSpan"                
                formControlName="timeSpan"
                label="Input TimeSpan"
                placeholder=" hh:mm:ss.tttttttttt">
            </app-form-text>
            
            <app-form-text
                transform="dateTime"                
                formControlName="dataHora"
                label="Input DateTime"
                placeholder="dd/mm/yyyy hh:mm:ss.tttttttttt">
            </app-form-text>
            
            <app-form-text
                transform="phonePtBr"                
                formControlName="telefone"
                label="Input Phone"
                placeholder="(dd) 9nnnn-nnnn">
            </app-form-text>
            
            <app-form-text
                formControlName="inputText"
                control-secret="true"
                autocomplete="off"
                label="Input text">
            </app-form-text>

            <app-form-text
                formControlName="inputPassword"
                control-secret="true"
                type="password"
                autocomplete="new-password"
                label="Input password">
            </app-form-text>

            <app-form-text
                formControlName="inputEmail"
                label="Input email"
                autocomplete="off">
            </app-form-text>

            <app-form-text
                formControlName="inputSearch"
                label="Input search">
            </app-form-text>

            <app-form-textarea
                class="full-width"
                formControlName="textArea"
                label="Text Area">
            </app-form-textarea>
            
            <app-form-editor
                class="full-width"
                formControlName="textEditor"
                label="Text Editor">
            </app-form-editor>
            
            <app-form-select
                formControlName="lista"
                label="Select an option"
                placeholder="Selecione uma permissão"
                [options]="itens" cleanable="true">
            </app-form-select>

            <app-form-select-multiple
                formControlName="listaMultipla"
                label="Select many options"
                placeholder="Selecione uma ou mais permissões"
                [options]="itens" cleanable="true">
            </app-form-select-multiple>
        </div>
        <fieldset class="form-row">
                <legend app-label 
                    [control]="form.controls.checkbox"
                    enabled-error="true">Checkboxes</legend>        
                <div formArrayName="checkbox">
                    @for (opcao of opcoes; track opcao.id; let i = $index) {
                    <app-form-checkbox 
                    [formControlName]="i"
                    inline="true" [value]="opcao.id">
                        {{opcao.descricao}}
                    </app-form-checkbox> 
                    }                    
                </div>
            </fieldset>
        <fieldset class="form-row">
            <legend app-label
                    [control]="form.controls.radio"
                    enabled-error="true">Radio Buttons</legend>
            @for (opcao of opcoes; track opcao.id; let i = $index) {
            <app-form-radio 
            formControlName="radio"
            group="radio" switch="true"
            inline="true" [value]="opcao.id">
                {{opcao.descricao}}
            </app-form-radio> 
            }
        </fieldset>
        <app-floating-bar class="form-row mb-3">  
            <div class="btn-group-mr">
                <button app-button action="submit" type="submit"></button>
                <button app-button action="cancel" type="button"></button>
                <app-button-dropdown
                    theme="warning"
                    title="Título aqui..."
                    text="Texto aqui...">
                    <button app-button 
                        theme="warning" dropdown-item>
                        Action - 1
                    </button>
                    <button app-button 
                        theme="info" dropdown-item>
                        Another Action
                    </button>
                    <button app-button 
                        action="edit" dropdown-item>
                    </button>
                </app-button-dropdown>
            </div>
        </app-floating-bar>
    </form>
</div>
