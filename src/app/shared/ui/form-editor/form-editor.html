<label app-label 
    [for]="id"
    [text]="label"
    [loading]="loading"
    [control]="control"
    (click)="emitLabelClick($event)"
    (error)="emitError($event)"
    (helper)="emitHelper()"
    [enabled-error]="showError()"
    [enabled-helper]="enabledHelper">
</label>

@if (isActive() && !isMobile()) {
<ckeditor
    [readOnly]="readonly || loading" [disabled]="disabled"
    [config]="completeConfig()" [ngModel]="value" (ngModelChange)="commitValue($event)" (blur)="emitBlur()"
    (ready)="emitReady($event)" (change)="emitEditorChange($event)" [id]="id">
</ckeditor>
}
@if (isActive() && isMobile()) {
<ckeditor
    [readOnly]="readonly || loading" [disabled]="disabled" 
    [config]="basicConfig()" [ngModel]="value" (ngModelChange)="commitValue($event)" (blur)="emitBlur()"
    (ready)="emitReady($event)" (change)="emitEditorChange($event)" [id]="id">
</ckeditor>
}
@if (!isActive()) {
<ckeditor [readOnly]="true" [disabled]="disabled" 
    [config]="disabledConfig()" [ngModel]="value" (ngModelChange)="commitValue($event)" (blur)="emitBlur()"
    (ready)="emitReady($event)" (change)="emitEditorChange($event)" [id]="id">
</ckeditor>
}
<ng-content></ng-content>
