<label app-label 
    [for]="id"
    [text]="label"
    [loading]="loading"
    (error)="emitError()"
    (helper)="emitHelper()"
    [enabled-error]="showError()"
    [enabled-helper]="enabledHelper">
</label>
<div class="form-element"
    [class.action-clear]="showClear()">
    <ng-select #ngSelect
        [labelForId]="id"
        [class]="elementClass()"
        [items]="options"
        bindValue="value"
        bindLabel="text"
        [multiple]="false"
        [clearable]="false"
        [placeholder]="placeholderText()"
        [searchable]="searchable"
        [closeOnSelect]="closeOnSelect"
        [disabled]="disabled || readonly || loading"
        [ngModel]="selectedValue()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="selectionChange($event)"
        (blur)="emitBlur()">

        <ng-template ng-option-tmp let-item="item">
            <span class="option-text" [title]="item.text">{{ item.text }}</span>
        </ng-template>
    </ng-select>
    @if (showClear()){
    <button app-button
        class="action-clear"
        title="clique para limpar a seleção"
        theme="transparent"
        type="button"
        (click)="clear()">
        <i class="fa fa-times"></i>
    </button>
    }
</div>
<ng-content></ng-content>
