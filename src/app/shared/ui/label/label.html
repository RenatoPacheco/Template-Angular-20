@if(loading) {
  <i class="loading fa fa-refresh fa-spin"></i>&nbsp;
}
@if (enabledHelperComputed()){
<i role="help" tabindex="0" (keydown.enter)="emitHelper()" (click)="emitHelper()" 
  title="informações de ajuda" class="help fa fa-question-circle">&nbsp;</i>
}
@if(enabledErrorComputed()){
<i role="alert" tabindex="0" (keydown.enter)="emitError()" (click)="emitError()" 
  title="informações sobre o erro" class="error fa fa-exclamation-circle">&nbsp;</i>    
}
<span class="text" #content><ng-content></ng-content></span>
@if(!content.hasChildNodes()){
<span class="text" [innerHTML]="textComputed()"></span>
}
